version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: customer_segmentation_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  python-ml:
    build: ./python
    container_name: customer_segmentation_ml
    ports:
      - "5001:5001"
    environment:
      - PORT=5001

  backend:
    build: ./backend
    container_name: customer_segmentation_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/customer_segmentation_db
      - JWT_SECRET=super_secret_jwt_key_customer_segmentation_2026
      - PYTHON_API=http://python-ml:5001
    depends_on:
      - mongodb
      - python-ml

  frontend:
    build: ./frontend
    container_name: customer_segmentation_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
